# HubSpot CRM API 2026-09.
#
# Connector flow:
# * ``list_tables`` → GET ``/crm-object-schemas/2026-09/schemas`` to discover custom objects
#   (we return empty results so the connector falls back to the standard
#   set of 9 CRM objects).
# * ``get_table_schema`` → GET ``/crm/properties/2026-09/{type}`` to
#   discover field types from the v3 results wrapper.
# * ``read_table`` → GET ``/crm/objects/2026-09/{table}`` first call;
#   POST ``/crm/objects/2026-09/{table}/search`` for incremental reads.
# * ``{object}_property_history`` tables → POST ``.../search`` for changed IDs,
#   then POST ``/crm/objects/2026-09/{object}/batch/read`` (custom handler) served
#   from the ``{object}_history`` corpus.
#
# Response wrapper for listing endpoints: ``{"results": [...], "paging": {}}``
# with paging empty so the connector terminates after one page.

endpoints:
  - path: /crm/associations/2026-09/{from_type}/{to_type}/batch/read
    method: POST
    handler: databricks.labs.community_connector.source_simulator.specs.hubspot.handlers.associations:serve_associations

  # Discovery — empty schemas → no custom objects.
  - path: /crm-object-schemas/2026-09/schemas
    method: GET
    corpus: schemas
    response:
      single_entity: true
      pagination_style: none

  # Discovery — properties per object type. The connector handles an empty
  # list by building the minimal base schema.
  - path: /crm/properties/2026-09/{object_type}
    method: GET
    corpus: properties
    response:
      pagination_style: none
      wrapper: {records_key: results}

  # Per-table listing endpoints (GET).
  - path: /crm/objects/2026-09/contacts
    method: GET
    corpus: contacts
    response: {pagination_style: none, wrapper: {records_key: results, extras: {paging: {}}}}
  - path: /crm/objects/2026-09/companies
    method: GET
    corpus: companies
    response: {pagination_style: none, wrapper: {records_key: results, extras: {paging: {}}}}
  - path: /crm/objects/2026-09/deals
    method: GET
    corpus: deals
    response: {pagination_style: none, wrapper: {records_key: results, extras: {paging: {}}}}
  - path: /crm/objects/2026-09/tickets
    method: GET
    corpus: tickets
    response: {pagination_style: none, wrapper: {records_key: results, extras: {paging: {}}}}
  - path: /crm/objects/2026-09/calls
    method: GET
    corpus: calls
    response: {pagination_style: none, wrapper: {records_key: results, extras: {paging: {}}}}
  - path: /crm/objects/2026-09/emails
    method: GET
    corpus: emails
    response: {pagination_style: none, wrapper: {records_key: results, extras: {paging: {}}}}
  - path: /crm/objects/2026-09/meetings
    method: GET
    corpus: meetings
    response: {pagination_style: none, wrapper: {records_key: results, extras: {paging: {}}}}
  - path: /crm/objects/2026-09/tasks
    method: GET
    corpus: tasks
    response: {pagination_style: none, wrapper: {records_key: results, extras: {paging: {}}}}
  - path: /crm/objects/2026-09/notes
    method: GET
    corpus: notes
    response: {pagination_style: none, wrapper: {records_key: results, extras: {paging: {}}}}

  # Search endpoint (POST) — used for incremental reads. Same wrapper.
  - path: /crm/objects/2026-09/contacts/search
    method: POST
    corpus: contacts
    response: {pagination_style: none, wrapper: {records_key: results, extras: {paging: {}, total: 0}}}
  - path: /crm/objects/2026-09/companies/search
    method: POST
    corpus: companies
    response: {pagination_style: none, wrapper: {records_key: results, extras: {paging: {}, total: 0}}}
  - path: /crm/objects/2026-09/deals/search
    method: POST
    corpus: deals
    response: {pagination_style: none, wrapper: {records_key: results, extras: {paging: {}, total: 0}}}
  - path: /crm/objects/2026-09/tickets/search
    method: POST
    corpus: tickets
    response: {pagination_style: none, wrapper: {records_key: results, extras: {paging: {}, total: 0}}}
  - path: /crm/objects/2026-09/calls/search
    method: POST
    corpus: calls
    response: {pagination_style: none, wrapper: {records_key: results, extras: {paging: {}, total: 0}}}
  - path: /crm/objects/2026-09/emails/search
    method: POST
    corpus: emails
    response: {pagination_style: none, wrapper: {records_key: results, extras: {paging: {}, total: 0}}}
  - path: /crm/objects/2026-09/meetings/search
    method: POST
    corpus: meetings
    response: {pagination_style: none, wrapper: {records_key: results, extras: {paging: {}, total: 0}}}
  - path: /crm/objects/2026-09/tasks/search
    method: POST
    corpus: tasks
    response: {pagination_style: none, wrapper: {records_key: results, extras: {paging: {}, total: 0}}}
  - path: /crm/objects/2026-09/notes/search
    method: POST
    corpus: notes
    response: {pagination_style: none, wrapper: {records_key: results, extras: {paging: {}, total: 0}}}

  # Batch read (POST) — used by the {object}_property_history tables to fetch
  # propertiesWithHistory for the IDs found via search. Inputs live in the
  # JSON body, so a custom handler filters the {object}_history corpus by ID.
  - path: /crm/objects/2026-09/{object_type}/batch/read
    method: POST
    handler: databricks.labs.community_connector.source_simulator.specs.hubspot.handlers.batch_read:serve_batch_read
